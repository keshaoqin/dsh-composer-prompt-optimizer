name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
      - name: Unit tests
        run: node --test test/*.test.mjs
      - name: Package sanity
        run: npm pack --dry-run
